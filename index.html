<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>i20 N DRL Control</title>
  <style>
    :root {
      --bg: #0b0d10;
      --card: linear-gradient(145deg, #1b1f27 0%, #13161c 100%);
      --nblue: #00a8e8;
      --nred: #e63946;
      --green: #2b9348;
      --text: #f8f9fa;
      --sub: #9aa5b4;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top center, #18202c 0%, #090b0e 75%);
      background-attachment: fixed;
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .header { text-align: center; margin-bottom: 12px; display: flex; flex-direction: column; align-items: center; }
    .title-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
    h1 {
      font-size: 24px;
      margin: 0;
      letter-spacing: 1.5px;
      font-weight: 900;
      font-style: italic;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 2px 10px rgba(0, 168, 232, 0.35);
    }
    
    .n-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff2a3c 0%, #9e0b18 100%);
      color: #ffffff;
      font-family: "Arial Black", Impact, sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 21px;
      padding: 1px 11px 2px 9px;
      transform: skewX(-18deg);
      border-radius: 4px;
      border-left: 3.5px solid #00b4d8;
      box-shadow: 0 3px 12px rgba(230, 57, 70, 0.65);
      letter-spacing: -1px;
    }
    .n-logo span { transform: skewX(6deg); display: inline-block; }

    #status {
      font-size: 13px;
      color: var(--sub);
      margin-top: 8px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 16px;
      width: 100%;
      max-width: 400px;
      margin-top: 12px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    .card-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: 0.3px;
    }
    
    .btn {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      transition: all 0.15s ease;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .btn:active { transform: scale(0.97); }
    
    .btn-connect {
      background: linear-gradient(135deg, #00b4d8 0%, #005f99 100%);
      margin-bottom: 10px;
      box-shadow: 0 4px 14px rgba(0, 180, 216, 0.35);
    }
    .btn-connect.connected {
      background: linear-gradient(135deg, #2b9348 0%, #155f24 100%);
      box-shadow: 0 4px 14px rgba(43, 147, 72, 0.35);
    }
    .btn-auto {
      background: linear-gradient(135deg, #38b000 0%, #007200 100%);
      font-size: 15px;
      margin-bottom: 10px;
      box-shadow: 0 4px 14px rgba(56, 176, 0, 0.35);
    }
    .btn-auto.active {
      outline: 2px solid #ffffff;
      box-shadow: 0 0 15px rgba(56, 176, 0, 0.7);
    }
    .btn-save {
      background: linear-gradient(135deg, #2ec4b6 0%, #1b8a5a 100%);
      margin-top: 18px;
      box-shadow: 0 4px 14px rgba(46, 196, 182, 0.35);
    }

    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
    .btn-flash {
      background: linear-gradient(135deg, #ff9e00 0%, #d00000 100%);
      padding: 16px 8px;
      font-size: 13px;
      box-shadow: 0 4px 15px rgba(208, 0, 0, 0.35);
    }
    .btn-flash.pressing { background: #ffffff !important; color: #000000 !important; text-shadow: none !important; }
    .btn-snap {
      background: linear-gradient(135deg, #3a86ff 0%, #7209b7 100%);
      padding: 16px 8px;
      font-size: 13px;
      box-shadow: 0 4px 15px rgba(114, 9, 183, 0.35);
    }

    .locked { opacity: 0.25; pointer-events: none; filter: grayscale(90%); transition: opacity 0.3s ease; }
    .lock-banner {
      background: linear-gradient(135deg, rgba(230, 57, 70, 0.22) 0%, rgba(155, 11, 29, 0.25) 100%);
      border: 1px solid var(--nred);
      color: #ffccd5;
      padding: 11px;
      border-radius: 12px;
      font-size: 12px;
      text-align: center;
      margin-top: 12px;
      width: 100%;
      max-width: 400px;
      font-weight: bold;
    }

    .tab-row { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; max-width: 400px; margin-top: 12px; gap: 8px; }
    .tab-btn {
      background: linear-gradient(145deg, #252a34 0%, #171a21 100%);
      padding: 12px 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: var(--sub);
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: 0.15s;
    }
    .tab-active {
      background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 12px rgba(0, 180, 216, 0.4);
    }

    /* Optimierter Farbrad-Bereich */
    .wheel-wrap { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      margin: 15px 0; 
      width: 100%;
    }
    canvas#colorWheel {
      border-radius: 50%;
      cursor: crosshair;
      touch-action: none;
      border: 3px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 22px rgba(0, 168, 232, 0.25);
      width: 100% !important;
      max-width: 240px !important;
      height: auto !important;
      aspect-ratio: 1 / 1;
      display: block;
    }
    .color-preview-text {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--sub);
    }

    .slot-row { display: flex; justify-content: space-between; margin-top: 10px; width: 100%; padding: 0 4px; }
    .slot-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.85);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 1px 4px #000;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: 0.12s;
      background: #888;
    }
    .slot-btn:active { transform: scale(0.92); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .btn-fx {
      background: linear-gradient(145deg, #2b313d 0%, #1c2028 100%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 13px 8px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      padding-left: 11px;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
    }
    .btn-fx.active {
      background: linear-gradient(135deg, #00b4d8 0%, #e63946 100%);
      border: 1px solid #ffffff;
      box-shadow: 0 4px 14px rgba(0, 180, 216, 0.45);
    }
    
    .sub-label { font-size: 12px; color: var(--sub); margin: 16px 0 6px 0; display: flex; justify-content: space-between; font-weight: 600; }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 11px;
      border-radius: 6px;
      background: linear-gradient(90deg, #1f242d 0%, #343c4a 100%);
      border: 1px solid rgba(255,255,255,0.08);
      outline: none;
      margin: 8px 0 4px 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8e2dc 100%);
      border: 1px solid rgba(0,0,0,0.1);
      cursor: pointer;
    }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-row">
      <h1>i20 <div class="n-logo"><span>N</span></div> DRL Control</h1>
    </div>
    <div id="status">Getrennt</div>
  </div>

  <div class="card" style="margin-top:0;">
    <button class="btn btn-connect" id="connectBtn">VERBINDEN VIA BLUETOOTH</button>
  </div>

  <!-- Tab-Leiste -->
  <div class="tab-row control-element locked">
    <div class="tab-btn tab-active" onclick="switchTab('tab-farbe')">FARBE</div>
    <div class="tab-btn" onclick="switchTab('tab-effekte')">EFFEKTE</div>
    <div class="tab-btn" onclick="switchTab('tab-optionen')">OPTIONEN</div>
  </div>

  <!-- Inhaltskarten -->
  <div id="controlPanel" class="control-element locked" style="width: 100%; max-width: 400px;">
    
    <!-- TAB: FARBE -->
    <div id="tab-farbe" class="tab-content active">
      <div class="card">
        <div class="card-title">STATISCHE DRÄHTE FARBE</div>
        <div class="wheel-wrap">
          <canvas id="colorWheel" width="300" height="300"></canvas>
          <div class="color-preview-text" id="colorText">RGB: (255, 255, 255)</div>
        </div>
        
        <div class="sub-label">SCHNELLWAHL-SLOTS</div>
        <div class="slot-row">
          <button class="slot-btn" style="background:#ff0000;" onclick="selectSlot(this, '#ff0000')">1</button>
          <button class="slot-btn" style="background:#00a8e8;" onclick="selectSlot(this, '#00a8e8')">2</button>
          <button class="slot-btn" style="background:#00ff00;" onclick="selectSlot(this, '#00ff00')">3</button>
          <button class="slot-btn" style="background:#ff00ff;" onclick="selectSlot(this, '#ff00ff')">4</button>
          <button class="slot-btn" style="background:#ffffff; color:#000;" onclick="selectSlot(this, '#ffffff')">5</button>
        </div>
      </div>
    </div>

    <!-- TAB: EFFEKTE -->
    <div id="tab-effekte" class="tab-content">
      <div class="card">
        <div class="card-title">DRL MODI & EFFEKTE</div>
        <div class="grid">
          <button class="btn-fx active" onclick="selectFx(this)">Statisches Licht</button>
          <button class="btn-fx" onclick="selectFx(this)">Atmen</button>
          <button class="btn-fx" onclick="selectFx(this)">Regenbogen-Welle</button>
          <button class="btn-fx" onclick="selectFx(this)">N-Performance</button>
          <button class="btn-fx" onclick="selectFx(this)">Strobe</button>
          <button class="btn-fx" onclick="selectFx(this)">Lauflicht Scan</button>
          <button class="btn-fx" onclick="selectFx(this)">Farbwechsel sanft</button>
        </div>
        
        <div class="sub-label"><span>GESCHWINDIGKEIT</span><span id="speedVal">50%</span></div>
        <input type="range" min="1" max="100" value="50" oninput="document.getElementById('speedVal').innerText = this.value + '%'">
      </div>
    </div>

    <!-- TAB: OPTIONEN -->
    <div id="tab-optionen" class="tab-content">
      <div class="card">
        <div class="card-title">SYSTEMKONFIGURATION</div>
        <button class="btn btn-auto" id="autoModeBtn" onclick="toggleAutoMode()">OEM AUTOMATIK-MODUS</button>
        
        <div class="sub-label">SPEZIALAKTIONEN</div>
        <div class="action-grid">
          <button class="btn btn-flash" id="flashHoldBtn">FLASH HOLD</button>
          <button class="btn btn-snap" onclick="triggerPhotoFlash()">FOTO-BLITZ (3s)</button>
        </div>

        <div class="sub-label"><span>DRL HELLIGKEIT</span><span id="brightVal">100%</span></div>
        <input type="range" min="10" max="100" value="100" oninput="document.getElementById('brightVal').innerText = this.value + '%'">

        <button class="btn btn-save" onclick="saveToController()">IM CONTROLLER SPEICHERN</button>
      </div>
    </div>

  </div>

  <div class="lock-banner" id="lockBanner">
    Bitte per Bluetooth verbinden, um die Steuerung freizuschalten.
  </div>

  <script>
    // Bluetooth Status & Verbindung
    let isConnected = false;
    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const lockBanner = document.getElementById('lockBanner');
    const lockedElements = document.querySelectorAll('.control-element');

    connectBtn.addEventListener('click', () => {
      isConnected = !isConnected;
      if(isConnected) {
        connectBtn.innerText = "VERBUNDEN";
        connectBtn.classList.add('connected');
        statusDiv.innerText = "Verbunden via Bluetooth";
        statusDiv.style.color = "#2b9348";
        lockBanner.style.display = "none";
        lockedElements.forEach(el => el.classList.remove('locked'));
      } else {
        connectBtn.innerText = "VERBINDEN VIA BLUETOOTH";
        connectBtn.classList.remove('connected');
        statusDiv.innerText = "Getrennt";
        statusDiv.style.color = "var(--sub)";
        lockBanner.style.display = "block";
        lockedElements.forEach(el => el.classList.add('locked'));
      }
    });

    // Tab Wechsel Logik
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('tab-active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      event.target.classList.add('tab-active');
      document.getElementById(tabId).classList.add('active');
    }

    // Canvas Farbrad Generator & Handling
    const canvas = document.getElementById('colorWheel');
    const ctx = canvas.getContext('2d');
    const radius = canvas.width / 2;

    function drawColorWheel() {
      for (let x = -radius; x < radius; x++) {
        for (let y = -radius; y < radius; y++) {
          let distance = Math.sqrt(x*x + y*y);
          if (distance <= radius) {
            let angle = Math.atan2(y, x);
            if (angle < 0) angle += 2 * Math.PI;
            
            let hue = (angle / (2 * Math.PI)) * 360;
            let saturation = distance / radius;
            let lightness = 0.5;
            
            ctx.fillStyle = `hsl(${hue}, ${saturation * 100}%, ${lightness * 100}%)`;
            ctx.fillRect(x + radius, y + radius, 1, 1);
          }
        }
      }
    }
    drawColorWheel();

    function getColorFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      // Unterstützt Maus- und Touch-Koordinaten gleichermaßen
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      const x = (clientX - rect.left) * (canvas.width / rect.width);
      const y = (clientY - rect.top) * (canvas.height / rect.height);
      
      const imgData = ctx.getImageData(x, y, 1, 1).data;
      if (imgData[3] > 0) { // Alpha-Wert prüfen (nur im Kreis)
        document.getElementById('colorText').innerText = `RGB: (${imgData[0]}, ${imgData[1]}, ${imgData[2]})`;
        // Hier Bluetooth RGB-Werte absenden
      }
    }

    // Maus- & Mobil-Touch-Events an das Farbrad binden
    canvas.addEventListener('mousedown', (e) => { getColorFromEvent(e); canvas.addEventListener('mousemove', getColorFromEvent); });
    window.addEventListener('mouseup', () => canvas.removeEventListener('mousemove', getColorFromEvent));
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); getColorFromEvent(e); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); getColorFromEvent(e); });

    // Schnellwahl & Menüfunktionen
    function selectSlot(btn, color) {
      document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('active-border'));
      btn.classList.add('active-border');
      document.getElementById('colorText').innerText = `Slot Farbe: ${color}`;
    }

    function selectFx(btn) {
      document.querySelectorAll('.btn-fx').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function toggleAutoMode() {
      document.getElementById('autoModeBtn').classList.toggle('active');
    }

    // Flash Hold Press & Hold Event
    const flashBtn = document.getElementById('flashHoldBtn');
    const startFlash = () => flashBtn.classList.add('pressing');
    const stopFlash = () => flashBtn.classList.remove('pressing');
    flashBtn.addEventListener('mousedown', startFlash);
    flashBtn.addEventListener('mouseup', stopFlash);
    flashBtn.addEventListener('touchstart', startFlash);
    flashBtn.addEventListener('touchend', stopFlash);

    function triggerPhotoFlash() {
      alert("Foto-Blitz für 3 Sekunden aktiviert!");
    }

    function saveToController() {
      alert("Einstellungen erfolgreich im DRL-Modul gespeichert!");
    }
  </script>
</body>
</html>
