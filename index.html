<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>i20 N DRL Control</title>
  <style>
    :root {
      --bg: #0b0d10;
      --card: linear-gradient(145deg, #1b1f27 0%, #13161c 100%);
      --nblue: #00a8e8;
      --nred: #e63946;
      --green: #2b9348;
      --text: #f8f9fa;
      --sub: #9aa5b4;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top center, #18202c 0%, #090b0e 75%);
      background-attachment: fixed;
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .header { text-align: center; margin-bottom: 12px; display: flex; flex-direction: column; align-items: center; }
    .title-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
    h1 {
      font-size: 24px;
      margin: 0;
      letter-spacing: 1.5px;
      font-weight: 900;
      font-style: italic;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 2px 10px rgba(0, 168, 232, 0.35);
    }
    
    .n-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff2a3c 0%, #9e0b18 100%);
      color: #ffffff;
      font-family: "Arial Black", Impact, sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 21px;
      padding: 1px 11px 2px 9px;
      transform: skewX(-18deg);
      border-radius: 4px;
      border-left: 3.5px solid #00b4d8;
      box-shadow: 0 3px 12px rgba(230, 57, 70, 0.65);
      letter-spacing: -1px;
    }
    .n-logo span { transform: skewX(6deg); display: inline-block; }

    #status {
      font-size: 13px;
      color: var(--sub);
      margin-top: 8px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 16px;
      width: 100%;
      max-width: 400px;
      margin-top: 12px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    .card-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: 0.3px;
    }
    
    .btn {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      transition: all 0.15s ease;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .btn:active { transform: scale(0.97); }
    
    .btn-connect {
      background: linear-gradient(135deg, #00b4d8 0%, #005f99 100%);
      margin-bottom: 10px;
      box-shadow: 0 4px 14px rgba(0, 180, 216, 0.35);
    }
    .btn-auto {
      background: linear-gradient(135deg, #38b000 0%, #007200 100%);
      font-size: 15px;
      margin-bottom: 10px;
      box-shadow: 0 4px 14px rgba(56, 176, 0, 0.35);
    }
    .btn-save {
      background: linear-gradient(135deg, #2ec4b6 0%, #1b8a5a 100%);
      margin-top: 18px;
      box-shadow: 0 4px 14px rgba(46, 196, 182, 0.35);
    }
    .btn-flash {
      background: linear-gradient(135deg, #ff9e00 0%, #d00000 100%);
      padding: 16px 8px;
      font-size: 13px;
      box-shadow: 0 4px 15px rgba(208, 0, 0, 0.35);
    }
    .btn-flash.pressing { background: #ffffff; color: #000000; text-shadow: none; border-color: #fff; }
    .btn-snap {
      background: linear-gradient(135deg, #3a86ff 0%, #7209b7 100%);
      padding: 16px 8px;
      font-size: 13px;
      box-shadow: 0 4px 15px rgba(114, 9, 183, 0.35);
    }

    .locked { opacity: 0.32; pointer-events: none; filter: grayscale(85%); }
    .lock-banner {
      background: linear-gradient(135deg, rgba(230, 57, 70, 0.22) 0%, rgba(155, 11, 29, 0.25) 100%);
      border: 1px solid var(--nred);
      color: #ffccd5;
      padding: 11px;
      border-radius: 12px;
      font-size: 12px;
      text-align: center;
      margin-top: 12px;
      width: 100%;
      max-width: 400px;
      font-weight: bold;
    }

    .tab-row { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; max-width: 400px; margin-top: 12px; gap: 8px; }
    .tab-btn {
      background: linear-gradient(145deg, #252a34 0%, #171a21 100%);
      padding: 12px 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: var(--sub);
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: 0.15s;
    }
    .tab-active {
      background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 12px rgba(0, 180, 216, 0.4);
    }

    /* Optimierter CSS Farbkreis & Vorschau */
    .wheel-wrap { display: flex; flex-direction: column; align-items: center; margin: 10px 0; position: relative; }
    .color-container { position: relative; width: 220px; height: 220px; }
    .color-wheel-css {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
      border: 3px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 22px rgba(0, 168, 232, 0.25);
      cursor: crosshair;
      touch-action: none;
    }
    .color-pointer {
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      background: rgba(0,0,0,0.3);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 4px rgba(0,0,0,0.8);
    }
    .live-preview-bar {
      width: 100%;
      height: 35px;
      border-radius: 8px;
      margin-top: 14px;
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 1px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      background-color: #ffffff;
      color: #000;
    }

    .slot-row { display: flex; justify-content: space-between; margin-top: 10px; }
    .slot-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.85);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 1px 4px #000;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: 0.12s;
    }
    .slot-btn:active { transform: scale(0.92); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .btn-fx {
      background: linear-gradient(145deg, #2b313d 0%, #1c2028 100%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 13px 8px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      padding-left: 11px;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
    }
    .btn-fx span { font-size: 9px; color: var(--sub); font-weight: normal; margin-top: 2px; }
    .btn-fx.active {
      background: linear-gradient(135deg, #00b4d8 0%, #e63946 100%);
      border: 1px solid #ffffff;
      box-shadow: 0 4px 14px rgba(0, 180, 216, 0.45);
    }
    .btn-fx.active span { color: #fff; }
    
    .sub-label { font-size: 12px; color: var(--sub); margin: 16px 0 6px 0; display: flex; justify-content: space-between; font-weight: 600; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 11px;
      border-radius: 6px;
      background: linear-gradient(90deg, #1f242d 0%, #343c4a 100%);
      border: 1px solid rgba(255,255,255,0.08);
      outline: none;
      margin: 8px 0 4px 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8e2dc 100%);
      border: 3px solid #00b4d8;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8e2dc 100%);
      border: 3px solid #00b4d8;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-row">
      <h1>i20</h1>
      <div class="n-logo"><span>N</span></div>
      <h1>DRL Control</h1>
    </div>
    <div id="status">Getrennt</div>
  </div>

  <button class="btn btn-connect" id="connectBtn">VERBINDEN VIA BLUETOOTH</button>

  <div class="tab-row">
    <div class="tab-btn tab-active" onclick="switchTab('color')">FARBE</div>
    <div class="tab-btn" onclick="switchTab('effects')">EFFEKTE</div>
    <div class="tab-btn" onclick="switchTab('config')">OPTIONEN</div>
  </div>

  <div class="card locked" id="mainControlCard">
    <!-- Panel 1: Farbe -->
    <div id="panel-color" class="panel active">
      <div class="card-title">STATISCHE DRÄHTE FARBE</div>
      <div class="wheel-wrap">
        <div class="color-container">
          <div id="colorWheel" class="color-wheel-css"></div>
          <div id="colorPointer" class="color-pointer"></div>
        </div>
        <div id="livePreview" class="live-preview-bar">GEWÄHLTE FARBE Vorschau</div>
      </div>
      <div class="sub-label">SCHNELLWAHL-SLOTS</div>
      <div class="slot-row">
        <button class="slot-btn" style="background:#ff0000;" onclick="setSlotColor('#ff0000')">1</button>
        <button class="slot-btn" style="background:#00b4d8;" onclick="setSlotColor('#00b4d8')">2</button>
        <button class="slot-btn" style="background:#ffffff;" onclick="setSlotColor('#ffffff')">3</button>
        <button class="slot-btn" style="background:#ffeb3b;" onclick="setSlotColor('#ffeb3b')">4</button>
        <button class="slot-btn" style="background:#9c27b0;" onclick="setSlotColor('#9c27b0')">5</button>
      </div>
    </div>

    <!-- Panel 2: Effekte -->
    <div id="panel-effects" class="panel">
      <div class="card-title">DRL MODI & EFFEKTE</div>
      <div class="grid">
        <button class="btn-fx active" onclick="setEffect(14, this)">Chaser Wave<span>Effekt 14 - Multi-Segment</span></button>
        <button class="btn-fx" onclick="setEffect(8, this)">N-Pulse Fire<span>Effekt 8 - N-Performance</span></button>
        <button class="btn-fx" onclick="setEffect(13, this)">Aurora Borealis<span>Effekt 13 - Nordlicht Flow</span></button>
        <button class="btn-fx" onclick="setEffect(18, this)">Cyber Neon Wave<span>Effekt 18 - Premium Mix</span></button>
        <button class="btn-fx" onclick="setEffect(17, this)">Spectrum Shift<span>Effekt 17 - Fade Spectrum</span></button>
        <button class="btn-fx" onclick="setEffect(12, this)">Glitch Strobe<span>Effekt 12 - Digital Storm</span></button>
        <button class="btn-fx" onclick="setEffect(10, this)">Interceptor Scan<span>Effekt 10 - In/Out Scanner</span></button>
      </div>
      <div class="sub-label">
        <span>GESCHWINDIGKEIT</span>
        <span id="speedVal">50%</span>
      </div>
      <input type="range" id="speedSlider" min="1" max="100" value="50" oninput="updateSliderLabel('speedVal', this.value + '%')">
    </div>

    <!-- Panel 3: Optionen -->
    <div id="panel-config" class="panel">
      <div class="card-title">SYSTEMKONFIGURATION</div>
      <button class="btn btn-auto" onclick="triggerAutoMode()">OEM AUTOMATIK-MODUS</button>
      
      <div class="sub-label">SPEZIALAKTIONEN</div>
      <div class="action-grid">
        <button class="btn btn-flash" id="flashBtn">FLASH HOLD</button>
        <button class="btn btn-snap" onclick="triggerAction('photo')">FOTO-BLITZ (3s)</button>
      </div>
      
      <div class="sub-label">
        <span>DRL HELLIGKEIT</span>
        <span id="brightVal">100%</span>
      </div>
      <input type="range" id="brightSlider" min="0" max="100" value="100" oninput="updateSliderLabel('brightVal', this.value + '%')">

      <button class="btn btn-save" onclick="saveSettingsToEEPROM()">IM CONTROLLER SPEICHERN</button>
    </div>
  </div>

  <div class="lock-banner" id="lockBanner">Bitte per Bluetooth verbinden, um die Steuerung freizuschalten.</div>

  <script>
    let connected = false;
    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const controlCard = document.getElementById('mainControlCard');
    const lockBanner = document.getElementById('lockBanner');
    const flashBtn = document.getElementById('flashBtn');
    const wheel = document.getElementById('colorWheel');
    const pointer = document.getElementById('colorPointer');
    const preview = document.getElementById('livePreview');

    // Bluetooth Verbindung
    connectBtn.addEventListener('click', () => {
      if (!connected) {
        statusDiv.innerText = "Verbinde...";
        statusDiv.style.color = "#ff9e00";
        setTimeout(() => {
          connected = true;
          statusDiv.innerText = "Verbunden (i20N-DRL)";
          statusDiv.style.color = "#2b9348";
          connectBtn.innerText = "TRENNE BLUETOOTHVERBINDUNG";
          connectBtn.style.background = "linear-gradient(135deg, #e63946 0%, #9e0b18 100%)";
          controlCard.classList.remove('locked');
          lockBanner.style.display = 'none';
        }, 1200);
      } else {
        connected = false;
        statusDiv.innerText = "Getrennt";
        statusDiv.style.color = "var(--sub)";
        connectBtn.innerText = "VERBINDEN VIA BLUETOOTH";
        connectBtn.style.background = "linear-gradient(135deg, #00b4d8 0%, #005f99 100%)";
        controlCard.classList.add('locked');
        lockBanner.style.display = 'block';
      }
    });

    // Tab-Wechsel
    function switchTab(tabId) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
      
      document.getElementById('panel-' + tabId).classList.add('active');
      event.target.classList.add('tab-active');
    }

    // Präzise Touch- und Maus-Farbwahl für Handys
    function processColor(e) {
      if(!connected) return;
      e.preventDefault();
      const rect = wheel.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      let x = clientX - rect.left - rect.width/2;
      let y = clientY - rect.top - rect.height/2;
      let radius = rect.width / 2;
      
      let angle = Math.atan2(y, x) * (180 / Math.PI);
      if (angle < 0) angle += 360;
      
      let dist = Math.sqrt(x*x + y*y);
      if (dist > radius) {
        x = (x / dist) * radius;
        y = (y / dist) * radius;
        dist = radius;
      }
      
      pointer.style.left = (x + radius) + 'px';
      pointer.style.top = (y + radius) + 'px';
      
      let saturation = Math.min(100, Math.round((dist / radius) * 100));
      let lightness = 50 + (100 - saturation) / 2; 
      let hslColor = `hsl(${Math.round(angle)}, ${saturation}%, 50%)`;
      
      preview.style.backgroundColor = hslColor;
      preview.style.color = lightness > 75 ? '#000000' : '#ffffff';
      preview.innerText = `HEX / HSL: ${Math.round(angle)}° | ${saturation}%`;
      
      console.log(`Sende DRL Farbe: HSL(${Math.round(angle)}, ${saturation}%, 50%)`);
    }

    ['mousedown', 'touchstart'].forEach(evt => {
      wheel.addEventListener(evt, (e) => {
        window.addEventListener(evt === 'mousedown' ? 'mousemove' : 'touchmove', processColor, {passive: false});
        processColor(e);
      }, {passive: false});
    });

    ['mouseup', 'touchend'].forEach(evt => {
      window.addEventListener(evt, () => {
        window.removeEventListener('mousemove', processColor);
        window.removeEventListener('touchmove', processColor);
      });
    });

    function setSlotColor(hex) {
      if(!connected) return;
      preview.style.backgroundColor = hex;
      preview.style.color = hex === '#ffffff' || hex === '#ffeb3b' ? '#000' : '#fff';
      preview.innerText = "SLOT AKTIV: " + hex;
      console.log("Slot geladen: " + hex);
    }

    function setEffect(effectId, btn) {
      document.querySelectorAll('.btn-fx').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      console.log("Sende an Controller - Effekt ID: " + effectId);
    }

    function updateSliderLabel(id, value) {
      document.getElementById(id).innerText = value;
      console.log(`${id === 'speedVal' ? 'Geschwindigkeit' : 'Helligkeit'} geändert auf: ${value}`);
    }

    function triggerAutoMode() {
      console.log("OEM Automodus aktiv.");
    }

    function triggerAction(type) {
      console.log("Spezialaktion ausgelöst: " + type);
    }

    function saveSettingsToEEPROM() {
      alert("Konfiguration dauerhaft im Controller gespeichert!");
    }

    // Flash Hold Interaktion
    ['touchstart', 'mousedown'].forEach(evt => {
      flashBtn.addEventListener(evt, (e) => {
        if(!connected) return;
        flashBtn.classList.add('pressing');
        console.log("Flash Hold: AN");
      });
    });

    ['touchend', 'mouseup', 'mouseleave'].forEach(evt => {
      flashBtn.addEventListener(evt, () => {
        if(!connected) return;
        flashBtn.classList.remove('pressing');
        console.log("Flash Hold: AUS");
      });
    });
  </script>
</body>
</html>
